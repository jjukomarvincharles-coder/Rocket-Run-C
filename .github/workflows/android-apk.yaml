name: Build Rocket Run Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Build game and copy offline dependencies
        run: |
          npm run build
          npm run verify
          npm run vendor
      - name: Generate Android project (only when not already committed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Capacitor and apply game identity, icon and orientation
        run: |
          npx cap sync android
          npm run android:prepare
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rocket-run-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
